<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 330" width="1280" height="330" role="img" aria-label="Codelith — code intelligence that runs on your machine.">
  <title>Codelith</title>

  <style>
    .t    { font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; }
    .word { font-size: 46px; letter-spacing: -0.5px; fill: #14120f; }
    .dot  { font-size: 46px; fill: #ff6b35; }
    .tag  { font-size: 11px; letter-spacing: 3.4px; fill: #8a847c; }
    .lead { font-size: 15px; fill: #14120f; }
    .lead2{ font-size: 15px; fill: #c2400c; }
    .chip { font-size: 11px; letter-spacing: 1.4px; fill: #55504a; }
    .sep  { font-size: 11px; fill: #ff6b35; }
  </style>

  <defs>
    <pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#14120f" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="330" fill="#f4f3ef"/>
  <rect width="1280" height="330" fill="url(#g)"/>
  <rect x="0" y="0" width="1280" height="3" fill="#ff6b35"/>

  <!-- the mark, at 0.42 of the source drawing -->
  <g transform="translate(478 58) scale(0.42)">
    <path fill="#D74A09" d="m52.6 142.8c-1.4-0.6-12.6-4.8-20.2-7.4-2.8-1.1-5.2-4.3-5.2-8.4v-92.6c0-5.5 3.6-10.5 8.1-11.7l58.7-15.3c1.4-0.4 3.4-0.4 4.8-0.1l14.4 4.6 0.3 0.1-56.4 16.2c-5.3 1.4-10 6.7-10 13.5v93.1c0 4.5 2 7.2 5.5 8z"/>
    <path fill="#D74A09" d="m114.6 124.3-56.4 16.1c-4.2 1-8-1.5-8-6v-92.4c0-5 3.7-9.7 8-11.1l56.4-15.9c4.6-1.4 8 1.3 8 6.1v91.9c0.1 5.4-3.4 10.2-8 11.3z"/>
    <path fill="#FFFFFF" d="m74.8 62.3-14.4 17.4c-0.7 0.9-1.1 1.8-1 2.8s0.3 1.8 1.1 2.3l14.5 10.4v-8.1l-8.7-6.3 8.6-10.3v-8.2h-0.1z"/>
    <polygon fill="#FFFFFF" points="77.9 97 83.6 95.4 93.1 54.2 87.1 55.9"/>
    <path fill="#FFFFFF" d="m111 66.6-14.9-10.3v8.4l8.7 6.3-8.7 10.2v8.2l15-17.4c1.7-1.8 1.8-4.4-0.1-5.4z"/>
  </g>

  <text class="t word" x="558" y="110">code<tspan class="dot">·</tspan>lith</text>
  <text class="t tag" x="640" y="150" text-anchor="middle">CODE INTELLIGENCE</text>

  <text class="t lead" x="640" y="208" text-anchor="middle">Your coding agent re-reads your repository from scratch every session, by grepping.</text>
  <text class="t lead2" x="640" y="232" text-anchor="middle">Codelith reads it once and serves it.</text>

  <line x1="440" y1="268" x2="840" y2="268" stroke="#dcd8d0"/>

  <text class="t chip" x="640" y="296" text-anchor="middle">RUNS ON YOUR MACHINE<tspan class="sep">&#160;&#160;·&#160;&#160;</tspan>ONE SQLITE FILE<tspan class="sep">&#160;&#160;·&#160;&#160;</tspan>MCP IN YOUR EDITOR</text>
</svg>
