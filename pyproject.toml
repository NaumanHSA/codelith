[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codelith"
version = "0.1.0"
description = "AI-Powered Documentation Generation Platform"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    # Solo mode runs the same schema on SQLite, and SQLAlchemy's async engine needs a
    # driver for it. The one package that profile genuinely adds — the vector search
    # it also needs is numpy, which is already here.
    "aiosqlite>=0.20.0",
    "alembic>=1.14.0",

    # Auth & Security
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    # passlib 1.7.4 probes its bcrypt backend with a >72-byte password. bcrypt 5.0
    # raises on that instead of truncating, so every hash_password() call dies with
    # "password cannot be longer than 72 bytes" — including seeding and login.
    "bcrypt>=4.0,<5",
    "python-multipart>=0.0.12",

    # Config & Validation
    # [email] is required: codelith/schemas/auth.py uses EmailStr, and without the extra
    # the app fails to import at startup.
    "pydantic[email]>=2.10.0",
    "pydantic-settings>=2.6.0",

    # LLM
    "openai>=1.57.0",
    "tiktoken>=0.7.0",
    "langchain-openai>=0.2.0",

    # Agent Workflows
    "langgraph>=0.2.60",
    "langchain-core>=0.3.25",
    "langchain-mcp-adapters>=0.1.0",
    # <2: mcp 2.0 removed the `@server.list_tools()` / `@server.call_tool()` decorators
    # that `codelith/mcp/server.py` is built on — `Server` there is handler-registration
    # only. Porting is a deliberate piece of work, not something a resolver should do on
    # our behalf, which is what `>=1.0.0` allowed.
    "mcp>=1.24.0,<2.0",

    # UI / tracing output
    "rich>=13.0.0",

    # Task Queue

    # Storage

    # Ingestion - Repos
    "gitpython>=3.1.43",
    "pygithub>=2.5.0",

    # Ingestion - Parsers
    "tree-sitter>=0.23.0",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
    "pyyaml>=6.0.2",
    # Renders the static HTML export. Same flavour the studio reads with
    # (react-markdown + remark-gfm), so an exported page matches what was on screen.
    # Already present transitively via rich; declared because we import it directly.
    "markdown-it-py>=3.0.0",
    "openapi-spec-validator>=0.7.1",

    # Vector search runs in this process over the embeddings stored in SQLite —
    # numpy is what does the arithmetic.

    # Graph DB

    # Logging & Observability
    "structlog>=24.4.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-exporter-otlp>=1.28.0",
    "prometheus-client>=0.21.0",

    # Utilities
    "httpx>=0.28.0",
    "tenacity>=9.0.0",
    "python-slugify>=8.0.4",
]

[project.scripts]
# The command the landing page has advertised since before it existed.
codelith = "codelith.cli:run"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "factory-boy>=3.3.1",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008",
    # Line length is the one rule with a real backlog — 143 violations spread over
    # forty files, mostly long call signatures and prose in docstrings. Enforcing it
    # today would mean a mechanical reformat of the whole tree in the same change that
    # turns CI on, and a diff nobody can review is not a review. Everything else is
    # enforced from now on; this comes off once the backlog is burned down.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# SQLAlchemy declares relationships as `Mapped["Project"]` — a forward reference to a
# class this module deliberately does not import, because importing it would make the
# model graph circular. Ruff reads the annotation as a name that does not exist. It is
# right about the name and wrong about the problem, and it is the entire reason ruff
# was never wired into CI.
"codelith/models/*.py" = ["F821"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Session-scoped fixtures (the test engine) and function-scoped tests must share one
# event loop, or the driver raises "attached to a different loop". pytest-asyncio 1.x
# removed the overridable `event_loop` fixture; these settings replace it.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.hatch.build.targets.wheel]
packages = ["codelith"]
