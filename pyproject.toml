[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "document-anything"
version = "0.1.0"
description = "AI-Powered Documentation Generation Platform"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",

    # Auth & Security
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.12",

    # Config & Validation
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",

    # LLM
    "openai>=1.57.0",

    # Agent Workflows
    "langgraph>=0.2.60",
    "langchain-core>=0.3.25",

    # Task Queue
    "celery[redis]>=5.4.0",
    "redis>=5.2.0",

    # Storage
    "boto3>=1.35.0",

    # Ingestion - Repos
    "gitpython>=3.1.43",
    "pygithub>=2.5.0",

    # Ingestion - Parsers
    "tree-sitter>=0.23.0",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
    "pyyaml>=6.0.2",
    "openapi-spec-validator>=0.7.1",

    # Vector search (pgvector — runs inside PostgreSQL, no extra service)
    "pgvector>=0.3.0",

    # Graph DB
    "neo4j>=5.27.0",

    # Logging & Observability
    "structlog>=24.4.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-exporter-otlp>=1.28.0",
    "prometheus-client>=0.21.0",

    # Utilities
    "httpx>=0.28.0",
    "tenacity>=9.0.0",
    "python-slugify>=8.0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "factory-boy>=3.3.1",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
