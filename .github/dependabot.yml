version: 2

# Ten open pull requests on the day the repository went public is how people learn to
# ignore the bot — including on the update that eventually matters. Everything here is
# aimed at one reviewable PR per ecosystem per cycle, and at not proposing changes that
# are already known to break the build.
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # Majors only, because minor and patch are ignored below. They still deserve
      # reading — that is why they are not silenced — but they do not each deserve
      # their own thread.
      #
      # There is no `python-minor` group any more and adding one back will not do
      # what it looks like it does. Grouping does not reach pip here at all:
      # measured on 2026-09-26, one Dependabot run produced a single grouped npm
      # pull request and four separate pip ones out of this same `groups:` block,
      # with `patterns: ["*"]` on both. npm has lock files and receives *version*
      # updates, which group; pip has only `>=` ranges in `pyproject.toml` and
      # receives *requirement* updates, which do not. A lock file would change that,
      # and is the only thing that would.
      python-major:
        patterns: ["*"]
        update-types: ["major"]
    ignore:
      # Both of these are pinned on purpose, with the reason written next to the pin
      # in `pyproject.toml`. Dependabot cannot read a comment, so it proposed them
      # anyway; merging either breaks the build.
      #
      #   bcrypt <5   — passlib 1.7.4 probes its backend with a >72-byte password,
      #                 which bcrypt 5.0 rejects.
      #   mcp <2.0    — `langchain-mcp-adapters` requires it, and 2.x removed the
      #                 decorators `codelith/mcp/server.py` is built on.
      #   openai <3   — `langchain-openai` requires `openai<3.0.0`. The proposed
      #                 `>=3.16.0` floor and that ceiling have no version between
      #                 them, so the set it produced was unresolvable.
      #
      # Only the majors are refused for these three, and the day a pin is lifted its
      # entry goes with it.
      - dependency-name: "bcrypt"
        update-types: ["version-update:semver-major"]
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]
      - dependency-name: "openai"
        update-types: ["version-update:semver-major"]

      # And every floor raise, from everything.
      #
      # Without a lock file a `>=` requirement can receive nothing else: a new
      # release never violates `>=`, so there is no fix in any of these — only the
      # declared minimum moving up to whatever shipped last week. Nine such pull
      # requests arrived in five days and not one of them changed a version anybody
      # installs, because `pip install codelith` already resolves to the newest
      # release the ceilings allow. What they do change is the floor, which is the
      # oldest version this is claimed to work on, and moving that up is a promise
      # being narrowed rather than a bug being fixed.
      #
      # Majors still come through, and that is the entry that matters: a major is a
      # real compatibility question, and it is how `langchain-openai`'s `openai<3`
      # conflict surfaced. Security updates are a separate channel and are not
      # affected by this.
      - dependency-name: "*"
        update-types:
          ["version-update:semver-patch", "version-update:semver-minor"]

  - package-ecosystem: "npm"
    directory: "/ui"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-minor:
        update-types: ["minor", "patch"]
      npm-major:
        update-types: ["major"]

  - package-ecosystem: "npm"
    # The root manifest, which vendors mermaid-cli and d2 so a job never needs the
    # network. It was not covered before, so its updates arrived one PR at a time.
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      tools:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      # All of them in one. Ungrouped, a month where five actions each cut a major
      # produced five pull requests that a reviewer reads as one decision anyway.
      actions:
        patterns: ["*"]
