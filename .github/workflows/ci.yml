name: CI

# On every push and every pull request. It was `workflow_dispatch` only while the
# product was being reshaped daily, on the reasoning that a notification nobody acts on
# is one people learn to dismiss — including the one that eventually matters. That
# reasoning stops applying the moment somebody else can install this.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege, set here rather than inherited. A repository's default token
# permission is a setting, it is often read-write, and a workflow that never needs to
# write should not be one compromised action away from being able to. Nothing in this
# file pushes, comments or releases.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install
        run: pip install -e ".[dev]"

      - name: ruff
        run: ruff check codelith/ tests/ alembic/

      - name: mypy
        # Not blocking. The codebase is not fully annotated and pretending otherwise
        # would mean a red check nobody reads; this surfaces regressions without
        # holding up a patch that did not cause them.
        continue-on-error: true
        run: mypy codelith/

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    env:
      # The suite provisions nothing — a temporary SQLite file, no services — but the
      # settings still need secrets to construct.
      APP_SECRET_KEY: "ci-test-secret"
      JWT_SECRET_KEY: "ci-test-jwt-secret"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: "pip"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Run the suite
        run: pytest tests/ -q --tb=short

  studio:
    name: Studio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: "pnpm"
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install
        working-directory: ui
        run: pnpm install --frozen-lockfile

      - name: Build
        # `pnpm build` is typecheck, then the two render checks that stand up a Vite
        # server and assert what the markdown and syntax-highlighting pipelines
        # actually produce, then the bundle. All four have caught real regressions.
        working-directory: ui
        run: pnpm build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        # Built, not pushed. The point is to know the Dockerfile still works, which is
        # the failure mode nobody notices until somebody tries to run the project.
        run: docker build -t codelith:ci .
