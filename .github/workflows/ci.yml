name: CI

on:
  # Manual only, deliberately, while the product is being reshaped daily.
  #
  # The suite is green locally — `make test` runs 1168 of them in thirty seconds with
  # nothing to provision — so this is not turned off to hide a failure. It is turned
  # off because every push during a redesign fired a run whose result nobody was going
  # to act on, and a notification nobody acts on is one people learn to dismiss,
  # including the one that eventually matters.
  #
  # Put `push` and `pull_request` back before this is published. A repository other
  # people install from needs CI that runs without being asked.
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        # `codelith/`, not `app/` — the package was renamed and this step had been
        # pointing at a path that no longer exists since. It never failed, because the
        # workflow was never triggered.
        run: ruff check codelith/ tests/ alembic/

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest tests/unit/ -v --tb=short --no-header

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    # No services. These used to need a Postgres container with pgvector and a Redis
    # one, plus a test database created by hand. They run against a temporary SQLite
    # file now, like the application does.
    env:
      APP_SECRET_KEY: "ci-test-secret"
      JWT_SECRET_KEY: "ci-test-jwt-secret"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run integration tests
        run: pytest tests/integration/ -v --tb=short --no-header

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push on PR)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: codelith:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-push:
    name: Push to Registry
    runs-on: ubuntu-latest
    needs: [docker, integration]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
