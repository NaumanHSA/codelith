name: Generate Documentation

on:
  workflow_dispatch:  # manual trigger only — re-enable push trigger when ready for automation
    inputs:
      project_id:
        description: "document-anything project ID to regenerate docs for"
        required: true
        default: "1"

jobs:
  trigger-doc-gen:
    name: Trigger Documentation Generation
    runs-on: ubuntu-latest
    steps:
      - name: Submit documentation job
        env:
          DOCANY_API_URL: ${{ secrets.DOCANY_API_URL }}
          DOCANY_API_TOKEN: ${{ secrets.DOCANY_API_TOKEN }}
          PROJECT_ID: ${{ github.event.inputs.project_id || '1' }}
        run: |
          JOB_RESPONSE=$(curl -s -X POST \
            "${DOCANY_API_URL}/api/v1/projects/${PROJECT_ID}/jobs" \
            -H "Authorization: Bearer ${DOCANY_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{
              "config": {
                "doc_types": ["architecture", "api", "modules", "getting_started"],
                "output_formats": ["markdown", "mkdocs"]
              }
            }')

          JOB_ID=$(echo "$JOB_RESPONSE" | jq -r '.id')
          echo "Triggered job: $JOB_ID"
          echo "job_id=$JOB_ID" >> $GITHUB_OUTPUT

          if [ -z "$JOB_ID" ] || [ "$JOB_ID" = "null" ]; then
            echo "Failed to create job: $JOB_RESPONSE"
            exit 1
          fi

      - name: Poll job until completion
        env:
          DOCANY_API_URL: ${{ secrets.DOCANY_API_URL }}
          DOCANY_API_TOKEN: ${{ secrets.DOCANY_API_TOKEN }}
        run: |
          JOB_ID="${{ steps.trigger-doc-gen.outputs.job_id }}"
          MAX_WAIT=1800  # 30 minutes
          ELAPSED=0

          while [ $ELAPSED -lt $MAX_WAIT ]; do
            STATUS=$(curl -s \
              "${DOCANY_API_URL}/api/v1/jobs/${JOB_ID}" \
              -H "Authorization: Bearer ${DOCANY_API_TOKEN}" | jq -r '.status')

            echo "Job $JOB_ID status: $STATUS"

            case "$STATUS" in
              completed)
                echo "Documentation generated successfully"
                exit 0
                ;;
              failed|cancelled)
                echo "Job $JOB_ID ended with status: $STATUS"
                exit 1
                ;;
            esac

            sleep 30
            ELAPSED=$((ELAPSED + 30))
          done

          echo "Timeout waiting for job $JOB_ID"
          exit 1
