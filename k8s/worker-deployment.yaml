apiVersion: apps/v1
kind: Deployment
metadata:
  name: docany-worker
  namespace: document-anything
  labels:
    app: docany-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: docany-worker
  template:
    metadata:
      labels:
        app: docany-worker
    spec:
      containers:
        - name: worker
          image: document-anything:latest
          envFrom:
            - configMapRef:
                name: docany-config
            - secretRef:
                name: docany-secrets
          command:
            - celery
            - -A
            - app.workers.celery_app
            - worker
            - --loglevel=info
            - --concurrency=2
            - -Q
            - generation,ingestion,export
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          volumeMounts:
            - name: sandbox
              mountPath: /tmp/jobs
      volumes:
        - name: sandbox
          emptyDir: {}
      terminationGracePeriodSeconds: 120
