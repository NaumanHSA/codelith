apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  namespace: {{ .Release.Namespace }}
data:
  APP_ENV: {{ .Values.config.appEnv | quote }}
  APP_HOST: "0.0.0.0"
  APP_PORT: "8000"
  DATABASE_URL: {{ .Values.config.databaseUrl | quote }}
  REDIS_URL: {{ .Values.config.redisUrl | quote }}
  CELERY_BROKER_URL: {{ .Values.config.celeryBrokerUrl | quote }}
  CELERY_RESULT_BACKEND: {{ .Values.config.celeryResultBackend | quote }}
  NEO4J_URI: {{ .Values.config.neo4jUri | quote }}
  S3_ENDPOINT_URL: {{ .Values.config.s3EndpointUrl | quote }}
  S3_BUCKET_NAME: {{ .Values.config.s3BucketName | quote }}
  OTEL_ENABLED: {{ .Values.config.otelEnabled | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.config.otelEndpoint | quote }}
  TRACING_ENABLED: "true"
  TRACING_SAVE_JSON: "true"
  JOB_SANDBOX_BASE_DIR: "/tmp/jobs"
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  APP_SECRET_KEY: {{ .Values.secrets.appSecretKey | quote }}
  JWT_SECRET_KEY: {{ .Values.secrets.jwtSecretKey | quote }}
  LLM_BASE_URL: {{ .Values.secrets.llmBaseUrl | quote }}
  LLM_API_KEY: {{ .Values.secrets.llmApiKey | quote }}
  NEO4J_PASSWORD: {{ .Values.secrets.neo4jPassword | quote }}
  S3_ACCESS_KEY: {{ .Values.secrets.s3AccessKey | quote }}
  S3_SECRET_KEY: {{ .Values.secrets.s3SecretKey | quote }}
