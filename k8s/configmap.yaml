apiVersion: v1
kind: ConfigMap
metadata:
  name: docany-config
  namespace: document-anything
data:
  APP_ENV: "production"
  APP_HOST: "0.0.0.0"
  APP_PORT: "8000"
  DATABASE_URL: "postgresql+asyncpg://docuser:docpassword@postgres:5432/documentanything"
  REDIS_URL: "redis://redis:6379/0"
  CELERY_BROKER_URL: "redis://redis:6379/1"
  CELERY_RESULT_BACKEND: "redis://redis:6379/2"
  NEO4J_URI: "bolt://neo4j:7687"
  S3_ENDPOINT_URL: "http://minio:9000"
  S3_BUCKET_NAME: "documentanything"
  S3_REGION: "us-east-1"
  OTEL_ENABLED: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
  TRACING_ENABLED: "true"
  TRACING_SAVE_JSON: "true"
  JOB_SANDBOX_BASE_DIR: "/tmp/jobs"
  REACT_MAX_ITERATIONS: "20"
---
apiVersion: v1
kind: Secret
metadata:
  name: docany-secrets
  namespace: document-anything
type: Opaque
stringData:
  APP_SECRET_KEY: "CHANGE_ME_IN_PRODUCTION"
  JWT_SECRET_KEY: "CHANGE_ME_IN_PRODUCTION"
  LLM_BASE_URL: "http://lm-studio:1234/v1"
  LLM_API_KEY: "lm-studio"
  NEO4J_PASSWORD: "neo4jpassword"
  S3_ACCESS_KEY: "minioadmin"
  S3_SECRET_KEY: "minioadmin"
